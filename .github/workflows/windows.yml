name: Windows release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    name: Windows x64 portable
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: rustup show active-toolchain

      - name: Download PDFium
        run: ./scripts/fetch-pdfium.ps1

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked -- --test-threads=1

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build and verify portable package
        run: ./scripts/build-windows.ps1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Package version not found.' }
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $archive = "dist/Folio-Flow-$tag-Windows-x64.zip"
          Compress-Archive -LiteralPath 'dist/Folio Flow' -DestinationPath $archive
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath $checksum -Encoding ascii
          $notes = "target/checks/release-notes.md"
          @"
          Windows x64 portable package / Windows x64 便携版

          Extract the ZIP and run Folio Flow.exe. Keep pdfium.dll beside it.
          解压 ZIP 后运行 Folio Flow.exe，请保留同目录的 pdfium.dll。

          Tests, formatting, Clippy, Release build and portable export check passed.
          已通过测试、格式检查、Clippy、Release 编译与便携包导出检查。

          Source commit: $env:GITHUB_SHA
          Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create $tag $archive $checksum --target $env:GITHUB_SHA --title "Folio Flow $tag" --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
